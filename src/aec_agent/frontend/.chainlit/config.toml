# Chainlit configuration for AEC Agent

[project]
# Enable telemetry (set to false in production)
enable_telemetry = false

# Session timeout in seconds
session_timeout = 3600

# Maximum number of threads per user
max_threads_per_user = 3

[features]
# Enable multi-modal file uploads
multi_modal = false

# Enable speech-to-text
speech_to_text = false

# Enable custom prompt playground
prompt_playground = false

[UI]
# App name shown in the header
name = "AEC Agent"

# Description shown in the chat welcome
description = "AI-powered AutoCAD and Revit automation"

# Show the readme in the sidebar
show_readme_as_default = false

# Default expanded messages
default_expand_messages = true

# Theme settings
theme = "dark"

# Enable the copy button for messages
copy_to_clipboard = true

# Enable LaTeX rendering
latex = false

# Custom CSS file (relative to .chainlit folder)
# custom_css = "styles.css"

# Custom JS file (relative to .chainlit folder)
# custom_js = "script.js"

# Favicon path
# favicon = "favicon.png"

# Logo path
# logo_dark = "logo_dark.png"
# logo_light = "logo_light.png"

[meta]
# Generated by AEC Agent installation
generated_by = "aec-agent"
