    valve:
      # HVAC-specific valves
      control:
        block_name: "M-VALV-CTRL"
        layer_suffix: "-VALV"
        description: "Control valve (2-way or 3-way)"
        attributes:
          SIZE: ""
          CV: ""
          TYPE: ""  # 2W, 3W
          TAG: ""

      balancing:
        block_name: "M-VALV-BAL"
        layer_suffix: "-VALV"
        description: "Balancing valve"
        attributes:
          SIZE: ""
          CV: ""
          TAG: ""

      isolation:
        block_name: "M-VALV-ISO"
        layer_suffix: "-VALV"
        description: "Isolation valve"
        attributes:
          SIZE: ""
          TYPE: ""
          TAG: ""
