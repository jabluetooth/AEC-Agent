# Alembic configuration for AEC Agent

[alembic]
# Path to migration scripts
script_location = src/aec_agent/db/migrations

# Prepend sys.path with src directory
prepend_sys_path = src

# Template used to generate migration files
file_template = %%(rev)s_%%(slug)s

# Timezone to use for new migration files (default: localtime)
# timezone =

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during migration generation
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
# sourceless = false

# Version path separator - use ; on Windows
# version_path_separator = ;

# Output encoding used when revision files are written
output_encoding = utf-8

# Connection string - set via DATABASE_URL environment variable
# sqlalchemy.url = postgresql://user:pass@localhost/dbname


[post_write_hooks]
# Optional hooks to run after generating migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
