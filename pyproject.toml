[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aec-agent"
version = "0.1.0"
description = "AI-powered AEC (Architecture, Engineering, Construction) Agent for AutoCAD and Revit automation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9,<3.13"
authors = [
    {name = "AEC Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=0.1.0",
    "httpx>=0.27.0",
    "chainlit>=1.0.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.1.0",
    "uvicorn>=0.27.0",
    "starlette>=0.36.0",
    "sse-starlette>=1.8.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=1.0.0",
    # Database (PostgreSQL with PostGIS + pgvector)
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Semantic search
    "sentence-transformers>=2.2.0",
    # PDF-to-image conversion (raster design pipeline)
    "PyMuPDF>=1.24.0",
    "Pillow>=10.0.0",
    # Image vectorization (raster-to-vector via OpenCV)
    # opencv-contrib-python includes ximgproc (FastLineDetector, thinning)
    "opencv-contrib-python>=4.8.0",
    "numpy>=1.24.0",
    # OCR text detection for vectorization pipeline
    "pytesseract>=0.3.10",
    # Skeletonization (centerline extraction for wiring diagrams)
    "scikit-image>=0.21.0",
    # Topology cleanup (segment graph merging, endpoint snapping)
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "black>=24.1.0",
    "pre-commit>=3.6.0",
]
# YOLOv8 neural network symbol detection (Phase 2.5.1)
yolo = [
    "ultralytics>=8.0.0",
    "onnxruntime>=1.15.0",
]
# All optional dependencies
all = [
    "aec-agent[dev,yolo]",
]

[project.scripts]
aec-agent = "aec_agent.cli:main"
aec-check-compat = "aec_agent.utils.version_checker:main"
aec-launch = "aec_agent.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/aec_agent --cov-report=term-missing"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
    "slow: Slow running tests",
    "requires_postgres: Tests requiring PostgreSQL with PostGIS + pgvector",
    "requires_embedding_model: Tests requiring sentence-transformers",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]  # Allow assert in tests

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.coverage.run]
source = ["src/aec_agent"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
